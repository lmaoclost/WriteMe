name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# long checks: one run per ref at a time; superseded runs cancel
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # floor-adjacent LTS allowed by engines: "^20.19.0 || >=22.0.0"
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build